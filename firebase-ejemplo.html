<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Firebase - Sistema de Orientación Laboral</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-section, .data-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
        }

        h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .google-btn {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .results {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .hidden {
            display: none;
        }

        .test-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Ejemplo de Firebase</h1>

        <!-- Sección de Autenticación -->
        <div class="auth-section" id="authSection">
            <h2>🔐 Autenticación</h2>

            <div id="loginForm">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" placeholder="usuario@email.com">
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="displayName" placeholder="Juan Pérez">
                </div>

                <button onclick="handleRegister()">Registrarse</button>
                <button onclick="handleLogin()">Iniciar Sesión</button>
                <button class="google-btn" onclick="handleGoogleLogin()">🔑 Iniciar con Google</button>
            </div>

            <div id="userProfile" class="user-info hidden">
                <h3>👤 Usuario Autenticado</h3>
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
                <p><strong>Nombre:</strong> <span id="userName"></span></p>
                <p><strong>UID:</strong> <span id="userId"></span></p>
                <button onclick="handleLogout()">Cerrar Sesión</button>
            </div>

            <div id="authStatus"></div>
        </div>

        <!-- Sección de Base de Datos -->
        <div class="data-section hidden" id="dataSection">
            <h2>💾 Base de Datos (Firestore)</h2>

            <div class="form-group">
                <h3>Guardar Resultado de Test</h3>
                <label>Tipo de Test:</label>
                <input type="text" id="testType" value="quiz" placeholder="quiz, interview, cv">

                <label>Puntuación (0-100):</label>
                <input type="number" id="testScore" value="85" min="0" max="100">

                <button onclick="saveTestExample()">Guardar Test</button>
            </div>

            <div class="form-group">
                <h3>Obtener Historial</h3>
                <button onclick="getTestHistory()">Ver Mis Tests</button>
                <button onclick="getStatistics()">Ver Estadísticas</button>
            </div>

            <div id="historyResults" class="results hidden"></div>
            <div id="dataStatus"></div>
        </div>

        <!-- Sección de Storage -->
        <div class="data-section hidden" id="storageSection">
            <h2>📁 Almacenamiento (Storage)</h2>

            <div class="form-group">
                <label>Subir CV (PDF, DOC, DOCX, TXT - Máx 5MB):</label>
                <input type="file" id="cvFile" accept=".pdf,.doc,.docx,.txt">
                <button onclick="uploadCVExample()">Subir CV</button>
            </div>

            <div class="form-group">
                <button onclick="listCVs()">Ver Mis CVs</button>
            </div>

            <div id="storageResults" class="results hidden"></div>
            <div id="storageStatus"></div>
        </div>
    </div>

    <!-- Importar Firebase usando ES Modules -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            updateProfile,
            GoogleAuthProvider,
            signInWithPopup
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            query,
            where,
            orderBy,
            limit,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL,
            listAll
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

        // CONFIGURACIÓN DE FIREBASE
        // ⚠️ REEMPLAZA ESTOS VALORES CON TU CONFIGURACIÓN
        const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUI",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Variables globales
        window.currentUser = null;

        // ========================================
        // AUTENTICACIÓN
        // ========================================

        window.handleRegister = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value;

            if (!email || !password || !displayName) {
                showStatus('authStatus', 'Completa todos los campos', 'error');
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName });
                showStatus('authStatus', '✅ Usuario registrado exitosamente', 'success');
            } catch (error) {
                showStatus('authStatus', '❌ Error: ' + getErrorMessage(error.code), 'error');
            }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showStatus('authStatus', 'Ingresa email y contraseña', 'error');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showStatus('authStatus', '✅ Sesión iniciada', 'success');
            } catch (error) {
                showStatus('authStatus', '❌ Error: ' + getErrorMessage(error.code), 'error');
            }
        };

        window.handleGoogleLogin = async function() {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                showStatus('authStatus', '✅ Sesión iniciada con Google', 'success');
            } catch (error) {
                showStatus('authStatus', '❌ Error: ' + getErrorMessage(error.code), 'error');
            }
        };

        window.handleLogout = async function() {
            try {
                await signOut(auth);
                showStatus('authStatus', '✅ Sesión cerrada', 'success');
            } catch (error) {
                showStatus('authStatus', '❌ Error al cerrar sesión', 'error');
            }
        };

        // Escuchar cambios de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('dataSection').classList.remove('hidden');
                document.getElementById('storageSection').classList.remove('hidden');

                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userName').textContent = user.displayName || 'Sin nombre';
                document.getElementById('userId').textContent = user.uid;
            } else {
                window.currentUser = null;
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                document.getElementById('dataSection').classList.add('hidden');
                document.getElementById('storageSection').classList.add('hidden');
            }
        });

        // ========================================
        // BASE DE DATOS
        // ========================================

        window.saveTestExample = async function() {
            if (!window.currentUser) {
                showStatus('dataStatus', 'Debes estar autenticado', 'error');
                return;
            }

            const testType = document.getElementById('testType').value;
            const score = parseInt(document.getElementById('testScore').value);

            try {
                const docRef = await addDoc(collection(db, 'test_results'), {
                    userId: window.currentUser.uid,
                    testType: testType,
                    score: score,
                    totalQuestions: 10,
                    correctAnswers: Math.round(score / 10),
                    timeSpent: 300,
                    createdAt: serverTimestamp()
                });

                showStatus('dataStatus', `✅ Test guardado con ID: ${docRef.id}`, 'success');
            } catch (error) {
                showStatus('dataStatus', '❌ Error: ' + error.message, 'error');
            }
        };

        window.getTestHistory = async function() {
            if (!window.currentUser) {
                showStatus('dataStatus', 'Debes estar autenticado', 'error');
                return;
            }

            try {
                const q = query(
                    collection(db, 'test_results'),
                    where('userId', '==', window.currentUser.uid),
                    orderBy('createdAt', 'desc'),
                    limit(10)
                );

                const querySnapshot = await getDocs(q);
                const results = [];

                querySnapshot.forEach((doc) => {
                    results.push({ id: doc.id, ...doc.data() });
                });

                const resultsDiv = document.getElementById('historyResults');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = '<h3>📊 Historial de Tests</h3>';

                results.forEach(test => {
                    resultsDiv.innerHTML += `
                        <div class="test-item">
                            <strong>${test.testType}</strong> -
                            Puntuación: ${test.score}/100 -
                            ${test.correctAnswers}/${test.totalQuestions} correctas
                        </div>
                    `;
                });

                showStatus('dataStatus', `✅ ${results.length} tests encontrados`, 'success');
            } catch (error) {
                showStatus('dataStatus', '❌ Error: ' + error.message, 'error');
            }
        };

        window.getStatistics = async function() {
            if (!window.currentUser) {
                showStatus('dataStatus', 'Debes estar autenticado', 'error');
                return;
            }

            try {
                const q = query(
                    collection(db, 'test_results'),
                    where('userId', '==', window.currentUser.uid)
                );

                const querySnapshot = await getDocs(q);
                let totalTests = 0;
                let totalScore = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    totalTests++;
                    totalScore += data.score || 0;
                });

                const average = totalTests > 0 ? (totalScore / totalTests).toFixed(2) : 0;

                const resultsDiv = document.getElementById('historyResults');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = `
                    <h3>📈 Estadísticas</h3>
                    <div class="test-item">
                        <p><strong>Total de Tests:</strong> ${totalTests}</p>
                        <p><strong>Puntuación Promedio:</strong> ${average}/100</p>
                    </div>
                `;

                showStatus('dataStatus', '✅ Estadísticas calculadas', 'success');
            } catch (error) {
                showStatus('dataStatus', '❌ Error: ' + error.message, 'error');
            }
        };

        // ========================================
        // STORAGE
        // ========================================

        window.uploadCVExample = async function() {
            if (!window.currentUser) {
                showStatus('storageStatus', 'Debes estar autenticado', 'error');
                return;
            }

            const fileInput = document.getElementById('cvFile');
            const file = fileInput.files[0];

            if (!file) {
                showStatus('storageStatus', 'Selecciona un archivo', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showStatus('storageStatus', 'El archivo es muy grande (máx 5MB)', 'error');
                return;
            }

            try {
                const timestamp = Date.now();
                const fileName = `${timestamp}_${file.name}`;
                const storageRef = ref(storage, `cvs/${window.currentUser.uid}/${fileName}`);

                await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(storageRef);

                showStatus('storageStatus', `✅ CV subido exitosamente`, 'success');
                document.getElementById('storageResults').classList.remove('hidden');
                document.getElementById('storageResults').textContent = `URL: ${downloadURL}`;
            } catch (error) {
                showStatus('storageStatus', '❌ Error: ' + error.message, 'error');
            }
        };

        window.listCVs = async function() {
            if (!window.currentUser) {
                showStatus('storageStatus', 'Debes estar autenticado', 'error');
                return;
            }

            try {
                const listRef = ref(storage, `cvs/${window.currentUser.uid}`);
                const result = await listAll(listRef);

                const resultsDiv = document.getElementById('storageResults');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = '<h3>📄 Mis CVs</h3>';

                for (const itemRef of result.items) {
                    const url = await getDownloadURL(itemRef);
                    resultsDiv.innerHTML += `
                        <div class="test-item">
                            <strong>${itemRef.name}</strong><br>
                            <a href="${url}" target="_blank">Descargar</a>
                        </div>
                    `;
                }

                showStatus('storageStatus', `✅ ${result.items.length} archivos encontrados`, 'success');
            } catch (error) {
                showStatus('storageStatus', '❌ Error: ' + error.message, 'error');
            }
        };

        // ========================================
        // UTILIDADES
        // ========================================

        function showStatus(elementId, message, type) {
            const statusDiv = document.getElementById(elementId);
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }

        function getErrorMessage(errorCode) {
            const errors = {
                'auth/email-already-in-use': 'Este correo ya está registrado',
                'auth/invalid-email': 'Correo electrónico inválido',
                'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres',
                'auth/user-not-found': 'Usuario no encontrado',
                'auth/wrong-password': 'Contraseña incorrecta',
                'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde',
                'auth/popup-closed-by-user': 'Ventana cerrada por el usuario'
            };
            return errors[errorCode] || 'Error desconocido';
        }

        console.log('🔥 Firebase ejemplo cargado correctamente');
    </script>
</body>
</html>
