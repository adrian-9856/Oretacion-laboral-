# ============================================
# Configuración de Netlify
# Sistema de Evaluación Laboral PRO
# Optimizado para múltiples usuarios concurrentes
# ============================================

[build]
  publish = "."
  command = ""

# ============================================
# HEADERS DE SEGURIDAD
# ============================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self)"
    # CORS para múltiples usuarios
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    # Cache agresivo para JS estático (1 año)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    # Cache agresivo para CSS estático (1 año)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    # Sin cache para HTML (siempre fresco)
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Asegurar que la página principal siempre esté actualizada
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ============================================
# REDIRECCIONES (SPA)
# ============================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# OPTIMIZACIÓN DE RENDIMIENTO
# ============================================

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ============================================
# CONFIGURACIÓN ADICIONAL
# ============================================

# Sin contextos específicos para evitar conflictos
